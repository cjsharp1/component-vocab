<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect class="region" x="0" y="0" width="800" height="350" />

  <!-- Trigger element (button) -->
  <rect class="hover-target" x="330" y="180" width="140" height="40" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="400" y1="175" x2="400" y2="155" />
    <rect class="label-bg" x="332" y="139" width="136" height="20" />
    <text class="label-text" x="400" y="153" text-anchor="middle">Trigger element</text>
  </g>
  <rect class="interactive" x="330" y="180" width="140" height="40" rx="4" />
  <line class="text-line" x1="365" y1="200" x2="435" y2="200" />

  <!-- Tooltip content -->
  <rect class="hover-target" x="310" y="110" width="180" height="45" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="400" y1="105" x2="400" y2="85" />
    <rect class="label-bg" x="327" y="69" width="146" height="20" />
    <text class="label-text" x="400" y="83" text-anchor="middle">Tooltip content</text>
  </g>
  <rect class="inverse" x="310" y="110" width="180" height="45" rx="4" />
  <line class="on-fill" x1="330" y1="125" x2="470" y2="125" stroke-width="2" stroke-linecap="round" />
  <line class="on-fill" x1="330" y1="140" x2="450" y2="140" stroke-width="2" stroke-linecap="round" />

  <!-- Arrow (optional) -->
  <rect class="hover-target" x="390" y="155" width="20" height="15" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="400" y1="170" x2="450" y2="170" />
    <rect class="label-bg" x="452" y="154" width="116" height="20" />
    <text class="label-text" x="510" y="168" text-anchor="middle">Arrow/pointer</text>
  </g>
  <path class="optional inverse" d="M 390 155 L 400 165 L 410 155 Z" stroke="none" />
</svg>

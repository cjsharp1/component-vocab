<svg viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Callout box with left border accent -->
  <rect class="region" x="150" y="50" width="500" height="150" rx="4" />
  <rect x="150" y="50" width="6" height="150" rx="4 0 0 4" fill="#0066cc" />

  <!-- Icon -->
  <rect class="hover-target" x="180" y="75" width="40" height="40" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="200" y1="70" x2="200" y2="50" />
    <rect class="label-bg" x="177" y="34" width="46" height="20" />
    <text class="label-text" x="200" y="48" text-anchor="middle">Icon</text>
  </g>
  <circle class="interactive optional" cx="200" cy="95" r="18" />
  <text x="200" y="100" text-anchor="middle" font-size="14" fill="#0066cc">i</text>

  <!-- Title/Label -->
  <rect class="hover-target" x="240" y="75" width="100" height="20" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="290" y1="70" x2="290" y2="50" />
    <rect class="label-bg" x="232" y="34" width="116" height="20" />
    <text class="label-text" x="290" y="48" text-anchor="middle">Title/Label</text>
  </g>
  <line class="text-line optional" x1="240" y1="85" x2="320" y2="85" />

  <!-- Content -->
  <rect class="hover-target" x="240" y="110" width="380" height="70" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="430" y1="185" x2="430" y2="205" />
    <rect class="label-bg" x="387" y="207" width="86" height="20" />
    <text class="label-text" x="430" y="221" text-anchor="middle">Content</text>
  </g>
  <line class="text-line" x1="240" y1="120" x2="600" y2="120" />
  <line class="text-line" x1="240" y1="140" x2="580" y2="140" />
  <line class="text-line" x1="240" y1="160" x2="610" y2="160" />

  <!-- Border/Accent indicator -->
  <rect class="hover-target" x="150" y="50" width="6" height="150" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="145" y1="125" x2="125" y2="125" />
    <rect class="label-bg" x="15" y="115" width="105" height="20" />
    <text class="label-text" x="67" y="129" text-anchor="middle">Border/Accent</text>
  </g>
</svg>

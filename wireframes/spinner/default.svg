<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect class="region" x="0" y="0" width="800" height="350" />

  <!-- Animation (circular spinner) -->
  <rect class="hover-target" x="340" y="120" width="120" height="120" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="400" y1="115" x2="400" y2="95" />
    <rect class="label-bg" x="342" y="79" width="116" height="20" />
    <text class="label-text" x="400" y="93" text-anchor="middle">Animation</text>
  </g>
  <circle cx="400" cy="180" r="50" fill="none" stroke="#e0e0e0" stroke-width="6" />
  <circle cx="400" cy="180" r="50" fill="none" stroke="#4a90d9" stroke-width="6" stroke-dasharray="157 314" stroke-linecap="round" />

  <!-- Label (optional) -->
  <rect class="hover-target" x="330" y="255" width="140" height="25" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="400" y1="285" x2="400" y2="305" />
    <rect class="label-bg" x="367" y="307" width="66" height="20" />
    <text class="label-text" x="400" y="321" text-anchor="middle">Label</text>
  </g>
  <line class="text-line" x1="350" y1="267" x2="450" y2="267" />
</svg>

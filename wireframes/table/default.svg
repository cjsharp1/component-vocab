<svg viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect class="region" x="0" y="0" width="800" height="250" />

  <!-- Table container -->
  <rect x="100" y="50" width="600" height="150" fill="none" stroke="var(--wireframe-border)" stroke-width="2" />

  <!-- Header row -->
  <rect class="hover-target" x="100" y="50" width="600" height="35" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="400" y1="45" x2="400" y2="25" />
    <rect class="label-bg" x="337" y="9" width="126" height="20" />
    <text class="label-text" x="400" y="23" text-anchor="middle">Header row</text>
  </g>
  <rect class="interactive" x="100" y="50" width="200" height="35" />
  <rect class="interactive" x="300" y="50" width="200" height="35" />
  <rect class="interactive" x="500" y="50" width="200" height="35" />
  <line class="text-line" x1="120" y1="67" x2="220" y2="67" />
  <line class="text-line" x1="320" y1="67" x2="420" y2="67" />
  <line class="text-line" x1="520" y1="67" x2="620" y2="67" />

  <!-- Data row 1 -->
  <rect class="hover-target" x="100" y="85" width="600" height="35" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="50" y1="102" x2="30" y2="102" />
    <rect class="label-bg" x="-34" y="92" width="68" height="20" />
    <text class="label-text" x="0" y="106" text-anchor="middle">Data row</text>
  </g>
  <line x1="100" y1="85" x2="700" y2="85" stroke="var(--wireframe-border)" stroke-width="1" />
  <line class="text-line" x1="120" y1="102" x2="190" y2="102" />
  <line class="text-line" x1="320" y1="102" x2="390" y2="102" />
  <line class="text-line" x1="520" y1="102" x2="590" y2="102" />

  <!-- Data row 2 -->
  <line x1="100" y1="120" x2="700" y2="120" stroke="var(--wireframe-border)" stroke-width="1" />
  <line class="text-line" x1="120" y1="137" x2="200" y2="137" />
  <line class="text-line" x1="320" y1="137" x2="400" y2="137" />
  <line class="text-line" x1="520" y1="137" x2="600" y2="137" />

  <!-- Data row 3 -->
  <line x1="100" y1="155" x2="700" y2="155" stroke="var(--wireframe-border)" stroke-width="1" />
  <line class="text-line" x1="120" y1="172" x2="195" y2="172" />
  <line class="text-line" x1="320" y1="172" x2="395" y2="172" />
  <line class="text-line" x1="520" y1="172" x2="595" y2="172" />
</svg>

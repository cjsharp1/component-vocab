<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Image/Media (left) -->
  <rect class="hover-target" x="50" y="50" width="350" height="250" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="225" y1="170" x2="225" y2="150" />
    <rect class="label-bg" x="160" y="134" width="130" height="20" />
    <text class="label-text" x="225" y="148" text-anchor="middle">Image/Media</text>
  </g>
  <rect class="media-placeholder" x="50" y="50" width="350" height="250" rx="4" />

  <!-- Title (right) -->
  <rect class="hover-target" x="430" y="70" width="320" height="25" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="590" y1="65" x2="590" y2="45" />
    <rect class="label-bg" x="564" y="29" width="52" height="20" />

  </g>
  <line class="text-line" x1="430" y1="80" x2="690" y2="80" />

  <!-- Description (right) -->
  <rect class="hover-target" x="430" y="115" width="320" height="90" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="590" y1="210" x2="590" y2="230" />
    <rect class="label-bg" x="539" y="232" width="102" height="20" />
    <text class="label-text" x="590" y="246" text-anchor="middle">Description</text>
  </g>
  <line class="text-line" x1="430" y1="125" x2="730" y2="125" />
  <line class="text-line" x1="430" y1="145" x2="710" y2="145" />
  <line class="text-line" x1="430" y1="165" x2="740" y2="165" />
  <line class="text-line" x1="430" y1="185" x2="700" y2="185" />

  <!-- Metadata (right) -->
  <rect class="hover-target" x="430" y="220" width="180" height="15" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="520" y1="215" x2="520" y2="195" />
    <rect class="label-bg" x="472" y="179" width="96" height="20" />

  </g>
  <line class="text-line optional" x1="430" y1="230" x2="580" y2="230" stroke-width="1" opacity="0.6" />

  <!-- Button/Link (right) -->
  <rect class="hover-target" x="430" y="260" width="100" height="35" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">

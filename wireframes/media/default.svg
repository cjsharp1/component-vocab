  <line class="text-line" x1="430" y1="90" x2="700" y2="90" />

  <!-- Text (right) -->
  <rect class="hover-target" x="430" y="120" width="320" height="90" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="590" y1="215" x2="590" y2="235" />

  </g>
  <rect class="media-placeholder" x="50" y="50" width="350" height="250" rx="4" />

  <!-- Heading (right) -->
  <rect class="hover-target" x="430" y="80" width="320" height="20" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">

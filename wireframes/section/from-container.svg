<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Full page background -->
  <rect class="track" x="0" y="0" width="800" height="350" />

  <!-- Container -->
  <rect class="hover-target" x="140" y="40" width="520" height="270" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="400" y1="30" x2="400" y2="10" />
    <rect class="label-bg" x="350" y="-6" width="100" height="20" />
    <text class="label-text" x="400" y="8" text-anchor="middle">Container</text>
  </g>
  <rect class="region" x="140" y="40" width="520" height="270" rx="4" />

  <!-- Content inside container -->
  <rect class="hover-target" x="180" y="80" width="440" height="190" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="400" y1="280" x2="400" y2="300" />
    <rect class="label-bg" x="360" y="302" width="80" height="20" />
    <text class="label-text" x="400" y="316" text-anchor="middle">Content</text>
  </g>
  <line class="text-line" x1="180" y1="100" x2="620" y2="100" />
  <line class="text-line" x1="180" y1="120" x2="580" y2="120" />
  <line class="text-line" x1="180" y1="140" x2="600" y2="140" />
  <line class="text-line" x1="180" y1="180" x2="610" y2="180" />
  <line class="text-line" x1="180" y1="200" x2="570" y2="200" />
  <line class="text-line" x1="180" y1="220" x2="590" y2="220" />
</svg>

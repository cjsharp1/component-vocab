<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect class="region" x="0" y="0" width="800" height="350" />

  <!-- Heading -->
  <rect class="hover-target" x="200" y="80" width="400" height="30" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="400" y1="70" x2="400" y2="50" />
    <rect class="label-bg" x="355" y="34" width="90" height="20" />
    <text class="label-text" x="400" y="48" text-anchor="middle">Heading</text>
  </g>
  <line class="text-line" x1="200" y1="95" x2="600" y2="95" />

  <!-- Supporting text -->
  <rect class="hover-target" x="250" y="135" width="300" height="40" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="400" y1="130" x2="400" y2="110" />
    <rect class="label-bg" x="314" y="94" width="172" height="20" />
    <text class="label-text" x="400" y="108" text-anchor="middle">Supporting text</text>
  </g>
  <line class="text-line" x1="250" y1="145" x2="550" y2="145" />
  <line class="text-line" x1="280" y1="165" x2="520" y2="165" />

  <!-- Primary Button -->
  <rect class="hover-target" x="270" y="210" width="260" height="50" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="400" y1="265" x2="400" y2="285" />
    <rect class="label-bg" x="337" y="287" width="126" height="20" />
    <text class="label-text" x="400" y="301" text-anchor="middle">Action buttons</text>
  </g>
  <rect class="interactive" x="270" y="210" width="120" height="50" rx="4" />
  <line class="text-line" x1="300" y1="235" x2="360" y2="235" />

  <!-- Secondary Button -->
  <rect class="interactive" x="410" y="210" width="120" height="50" rx="4" />
  <line class="text-line" x1="440" y1="235" x2="500" y2="235" />
</svg>

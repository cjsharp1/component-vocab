<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect class="region" x="0" y="0" width="800" height="350" />

  <!-- Plan 1 -->
  <rect class="hover-target" x="50" y="50" width="200" height="250" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="150" y1="45" x2="150" y2="25" />
    <rect class="label-bg" x="116" y="9" width="68" height="20" />
    <text class="label-text" x="150" y="23" text-anchor="middle">Plan card</text>
  </g>
  <rect class="interactive" x="50" y="50" width="200" height="250" rx="4" />
  <line class="text-line" x1="70" y1="80" x2="130" y2="80" />
  <text x="70" y="115" font-size="24">$19</text>
  <line class="text-line" x1="70" y1="150" x2="220" y2="150" />
  <line class="text-line" x1="70" y1="170" x2="210" y2="170" />
  <line class="text-line" x1="70" y1="190" x2="215" y2="190" />
  <rect class="interactive" x="70" y="230" width="140" height="40" rx="4" />

  <!-- Plan 2 (Highlighted) -->
  <rect class="interactive" x="280" y="30" width="200" height="290" rx="4" style="stroke: var(--wireframe-interactive);stroke-width:3" />
  <rect class="filled" x="310" y="45" width="80" height="20" rx="10" />
  <line class="text-line" x1="310" y1="90" x2="370" y2="90" />
  <text x="310" y="125" font-size="24">$49</text>
  <line class="text-line" x1="310" y1="160" x2="460" y2="160" />
  <line class="text-line" x1="310" y1="180" x2="450" y2="180" />
  <line class="text-line" x1="310" y1="200" x2="455" y2="200" />
  <rect class="interactive" x="310" y="250" width="140" height="40" rx="4" style="fill: var(--wireframe-interactive)" />

  <!-- Plan 3 -->
  <rect class="interactive" x="510" y="50" width="200" height="250" rx="4" />
  <line class="text-line" x1="530" y1="80" x2="590" y2="80" />
  <text x="530" y="115" font-size="24">$99</text>
  <line class="text-line" x1="530" y1="150" x2="680" y2="150" />
  <line class="text-line" x1="530" y1="170" x2="670" y2="170" />
  <line class="text-line" x1="530" y1="190" x2="675" y2="190" />
  <rect class="interactive" x="530" y="230" width="140" height="40" rx="4" />

  <!-- Feature list label -->
  <rect class="hover-target" x="70" y="150" width="150" height="50" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="20" y1="175" x2="0" y2="175" />
    <rect class="label-bg" x="-76" y="165" width="80" height="20" />
    <text class="label-text" x="-36" y="179" text-anchor="middle">Features</text>
  </g>
</svg>

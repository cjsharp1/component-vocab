<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background page (dimmed) -->
  <rect class="region scrim" x="0" y="0" width="800" height="350" />

  <!-- Modal -->
  <rect class="hover-target" x="200" y="50" width="400" height="250" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="150" y1="175" x2="130" y2="175" />
    <rect class="label-bg" x="76" y="165" width="58" height="20" />
    <text class="label-text" x="105" y="179" text-anchor="middle">Modal</text>
  </g>
  <rect class="on-fill-fill" x="200" y="50" width="400" height="250" stroke="var(--wireframe-border)" stroke-width="2" rx="8" />

  <!-- Header -->
  <rect class="hover-target" x="200" y="50" width="400" height="50" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="400" y1="45" x2="400" y2="25" />
    <rect class="label-bg" x="369" y="9" width="62" height="20" />
    <text class="label-text" x="400" y="23" text-anchor="middle">Header</text>
  </g>
  <line class="text-line" x1="220" y1="75" x2="350" y2="75" />

  <!-- Close button -->
  <circle cx="570" cy="75" r="12" class="interactive" />
  <line class="on-fill" x1="565" y1="70" x2="575" y2="80" stroke-width="2" />
  <line class="on-fill" x1="575" y1="70" x2="565" y2="80" stroke-width="2" />

  <!-- Divider -->
  <line x1="200" y1="100" x2="600" y2="100" stroke="var(--wireframe-border)" stroke-width="1" />

  <!-- Content -->
  <rect class="hover-target" x="220" y="120" width="360" height="120" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="650" y1="180" x2="670" y2="180" />
    <rect class="label-bg" x="672" y="170" width="60" height="20" />
    <text class="label-text" x="702" y="184" text-anchor="middle">Content</text>
  </g>
  <line class="text-line" x1="220" y1="135" x2="560" y2="135" />
  <line class="text-line" x1="220" y1="155" x2="540" y2="155" />
  <line class="text-line" x1="220" y1="175" x2="550" y2="175" />
  <line class="text-line" x1="220" y1="195" x2="530" y2="195" />

  <!-- Footer buttons -->
  <line x1="200" y1="250" x2="600" y2="250" stroke="var(--wireframe-border)" stroke-width="1" />
  <rect class="interactive" x="440" y="260" width="70" height="30" rx="4" />
  <rect class="interactive" x="520" y="260" width="70" height="30" rx="4" />
</svg>

<svg viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect class="region" x="0" y="0" width="800" height="250" />

  <!-- Breadcrumb trail -->
  <rect class="hover-target" x="100" y="95" width="600" height="30" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="400" y1="90" x2="400" y2="70" />
    <rect class="label-bg" x="321" y="54" width="158" height="20" />
    <text class="label-text" x="400" y="68" text-anchor="middle">Breadcrumb trail</text>
  </g>

  <!-- Home link -->
  <line class="text-line" x1="100" y1="110" x2="150" y2="110" style="stroke:#0066cc" />
  <text x="175" y="114" font-size="16" fill="#666">/</text>

  <!-- Category link -->
  <line class="text-line" x1="195" y1="110" x2="265" y2="110" style="stroke:#0066cc" />
  <text x="285" y="114" font-size="16" fill="#666">/</text>

  <!-- Subcategory link -->
  <line class="text-line" x1="305" y1="110" x2="400" y2="110" style="stroke:#0066cc" />
  <text x="420" y="114" font-size="16" fill="#666">/</text>

  <!-- Current page (not linked) -->
  <rect class="hover-target" x="440" y="95" width="110" height="30" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="495" y1="130" x2="495" y2="150" />
    <rect class="label-bg" x="429" y="152" width="132" height="20" />
    <text class="label-text" x="495" y="166" text-anchor="middle">Current page</text>
  </g>
  <line class="text-line" x1="440" y1="110" x2="550" y2="110" />

  <!-- Separator label -->
  <rect class="hover-target" x="170" y="100" width="15" height="20" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="177" y1="130" x2="177" y2="150" />
    <rect class="label-bg" x="131" y="152" width="92" height="20" />
    <text class="label-text" x="177" y="166" text-anchor="middle">Separator</text>
  </g>
</svg>

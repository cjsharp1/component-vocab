<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <rect class="hover-target" x="280" y="40" width="240" height="25" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="400" y1="35" x2="400" y2="15" />
    <rect class="label-bg" x="374" y="0" width="52" height="20" />
    <text class="label-text" x="400" y="14" text-anchor="middle">Title</text>
  </g>
  <line class="text-line optional" x1="320" y1="52" x2="480" y2="52" />

  <!-- Key-value pair 1 -->
  <rect class="hover-target" x="200" y="95" width="400" height="30" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="400" y1="90" x2="400" y2="70" />
    <rect class="label-bg" x="318" y="54" width="164" height="20" />
    <text class="label-text" x="400" y="68" text-anchor="middle">Key-value pairs</text>
  </g>

  <circle class="interactive optional" cx="220" cy="110" r="10" />
  <line class="text-line" x1="250" y1="110" x2="350" y2="110" stroke-width="1" opacity="0.7" />
  <line class="text-line" x1="450" y1="110" x2="550" y2="110" />

  <!-- Key-value pair 2 -->
  <circle class="interactive optional" cx="220" cy="155" r="10" />
  <line class="text-line" x1="250" y1="155" x2="350" y2="155" stroke-width="1" opacity="0.7" />
  <line class="text-line" x1="450" y1="155" x2="550" y2="155" />

  <!-- Key-value pair 3 -->
  <circle class="interactive optional" cx="220" cy="200" r="10" />
  <line class="text-line" x1="250" y1="200" x2="350" y2="200" stroke-width="1" opacity="0.7" />
  <line class="text-line" x1="450" y1="200" x2="550" y2="200" />

  <!-- Key-value pair 4 -->
  <circle class="interactive optional" cx="220" cy="245" r="10" />
  <line class="text-line" x1="250" y1="245" x2="350" y2="245" stroke-width="1" opacity="0.7" />
  <line class="text-line" x1="450" y1="245" x2="550" y2="245" />

  <!-- Labels for key and value -->
  <text x="300" y="80" text-anchor="middle" font-size="11" fill="#999">Key (label)</text>
  <text x="500" y="80" text-anchor="middle" font-size="11" fill="#999">Value</text>

  <!-- Icon per row label -->
  <rect class="hover-target" x="210" y="100" width="20" height="20" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="205" y1="165" x2="185" y2="165" />
    <rect class="label-bg" x="82" y="155" width="98" height="20" />
    <text class="label-text" x="131" y="169" text-anchor="middle">Icon per row</text>
  </g>
</svg>

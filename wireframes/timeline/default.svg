<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Vertical line (timeline axis) -->
  <line x1="150" y1="40" x2="150" y2="310" stroke="#ccc" stroke-width="2" />

  <!-- Event 1 -->
  <rect class="hover-target" x="70" y="50" width="60" height="15" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="100" y1="45" x2="100" y2="25" />
    <rect class="label-bg" x="58" y="9" width="84" height="20" />
    <text class="label-text" x="100" y="23" text-anchor="middle">Date/Time</text>
  </g>
  <line class="text-line optional" x1="70" y1="60" x2="120" y2="60" stroke-width="1" opacity="0.6" />

  <rect class="hover-target" x="140" y="50" width="20" height="20" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="150" y1="45" x2="150" y2="25" />
    <rect class="label-bg" x="95" y="9" width="110" height="20" />
    <text class="label-text" x="150" y="23" text-anchor="middle">Icon/Marker</text>
  </g>
  <circle class="interactive optional" cx="150" cy="60" r="8" />

  <rect class="hover-target" x="180" y="50" width="200" height="15" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="280" y1="45" x2="280" y2="25" />
    <rect class="label-bg" x="254" y="9" width="52" height="20" />
    <text class="label-text" x="280" y="23" text-anchor="middle">Title</text>
  </g>
  <line class="text-line" x1="180" y1="60" x2="330" y2="60" />

  <rect class="hover-target" x="180" y="75" width="220" height="30" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="290" y1="110" x2="290" y2="130" />
    <rect class="label-bg" x="239" y="132" width="102" height="20" />
    <text class="label-text" x="290" y="146" text-anchor="middle">Description</text>
  </g>
  <line class="text-line optional" x1="180" y1="85" x2="380" y2="85" stroke-width="1" opacity="0.7" />
  <line class="text-line optional" x1="180" y1="100" x2="360" y2="100" stroke-width="1" opacity="0.7" />

  <!-- Event 2 -->
  <line class="text-line" x1="70" y1="155" x2="120" y2="155" stroke-width="1" opacity="0.6" />
  <circle class="interactive" cx="150" cy="155" r="8" />
  <line class="text-line" x1="180" y1="155" x2="330" y2="155" />
  <line class="text-line" x1="180" y1="180" x2="380" y2="180" stroke-width="1" opacity="0.7" />
  <line class="text-line" x1="180" y1="195" x2="360" y2="195" stroke-width="1" opacity="0.7" />

  <!-- Event 3 -->
  <line class="text-line" x1="70" y1="250" x2="120" y2="250" stroke-width="1" opacity="0.6" />
  <circle class="interactive" cx="150" cy="250" r="8" />
  <line class="text-line" x1="180" y1="250" x2="330" y2="250" />
  <line class="text-line" x1="180" y1="275" x2="380" y2="275" stroke-width="1" opacity="0.7" />
  <line class="text-line" x1="180" y1="290" x2="360" y2="290" stroke-width="1" opacity="0.7" />
</svg>

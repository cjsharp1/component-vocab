<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Items label -->
  <rect class="hover-target" x="50" y="30" width="700" height="290" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="400" y1="25" x2="400" y2="5" />
    <rect class="label-bg" x="372" y="0" width="56" height="20" />
    <text class="label-text" x="400" y="14" text-anchor="middle">Items</text>
  </g>

  <!-- Large featured item (left) -->
  <rect class="media-placeholder" x="50" y="30" width="320" height="290" rx="8" />
  <text x="210" y="180" text-anchor="middle" font-size="14" opacity="0.7">Featured</text>

  <!-- Small item 1 (top right) -->
  <rect class="media-placeholder" x="390" y="30" width="180" height="135" rx="8" />
  <text x="480" y="102" text-anchor="middle" font-size="12" opacity="0.7">Small</text>

  <!-- Small item 2 (middle right) -->
  <rect class="media-placeholder" x="590" y="30" width="160" height="135" rx="8" />
  <text x="670" y="102" text-anchor="middle" font-size="12" opacity="0.7">Small</text>

  <!-- Medium item (bottom right top) -->
  <rect class="media-placeholder" x="390" y="185" width="230" height="135" rx="8" />
  <text x="505" y="257" text-anchor="middle" font-size="12" opacity="0.7">Medium</text>

  <!-- Small item 3 (bottom right bottom) -->
  <rect class="media-placeholder" x="640" y="185" width="110" height="135" rx="8" />
  <text x="695" y="257" text-anchor="middle" font-size="11" opacity="0.7">Small</text>
</svg>

<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Quote marks -->
  <text x="250" y="80" font-size="48" opacity="0.6">"</text>

  <!-- Quote -->
  <rect class="hover-target" x="250" y="100" width="300" height="80" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="400" y1="95" x2="400" y2="75" />
    <rect class="label-bg" x="367" y="59" width="66" height="20" />
    <text class="label-text" x="400" y="73" text-anchor="middle">Quote</text>
  </g>
  <line class="text-line" x1="270" y1="110" x2="530" y2="110" />
  <line class="text-line" x1="250" y1="130" x2="540" y2="130" />
  <line class="text-line" x1="260" y1="150" x2="520" y2="150" />
  <line class="text-line" x1="270" y1="170" x2="510" y2="170" />

  <!-- Author photo -->
  <rect class="hover-target" x="250" y="210" width="40" height="40" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="270" y1="255" x2="270" y2="275" />
    <rect class="label-bg" x="203" y="277" width="134" height="20" />
    <text class="label-text" x="270" y="291" text-anchor="middle">Author photo</text>
  </g>
  <circle class="media-placeholder optional" cx="270" cy="230" r="20" />

  <!-- Author name -->
  <rect class="hover-target" x="305" y="215" width="140" height="15" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="375" y1="210" x2="375" y2="190" />
    <rect class="label-bg" x="311" y="174" width="128" height="20" />
    <text class="label-text" x="375" y="188" text-anchor="middle">Author name</text>
  </g>
  <line class="text-line" x1="305" y1="223" x2="430" y2="223" />

  <!-- Author role/company -->
  <rect class="hover-target" x="305" y="235" width="180" height="12" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="395" y1="252" x2="395" y2="272" />
    <rect class="label-bg" x="284" y="274" width="222" height="20" />
    <text class="label-text" x="395" y="288" text-anchor="middle">Author role/company</text>
  </g>
  <line class="text-line optional" x1="305" y1="243" x2="460" y2="243" stroke-width="1" opacity="0.6" />

  <!-- Rating -->
  <rect class="hover-target" x="490" y="220" width="80" height="15" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="530" y1="215" x2="530" y2="195" />
    <rect class="label-bg" x="491" y="179" width="78" height="20" />
    <text class="label-text" x="530" y="193" text-anchor="middle">Rating</text>
  </g>
  <text x="500" y="233" font-size="14" opacity="0.8">★ ★ ★ ★ ★</text>
</svg>

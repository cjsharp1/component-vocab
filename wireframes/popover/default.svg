<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect class="region" x="0" y="0" width="800" height="350" />

  <!-- Trigger element -->
  <rect class="hover-target" x="320" y="250" width="160" height="45" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="400" y1="300" x2="400" y2="320" />
    <rect class="label-bg" x="332" y="322" width="136" height="20" />
    <text class="label-text" x="400" y="336" text-anchor="middle">Trigger element</text>
  </g>
  <rect class="interactive" x="320" y="250" width="160" height="45" rx="4" />
  <line class="text-line" x1="360" y1="272" x2="440" y2="272" />

  <!-- Popover panel -->
  <rect x="250" y="40" width="300" height="180" rx="6" fill="#fff" stroke="#999" stroke-width="2" />

  <!-- Header/title (optional) -->
  <rect class="hover-target" x="265" y="50" width="270" height="30" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="400" y1="45" x2="400" y2="25" />
    <rect class="label-bg" x="342" y="9" width="116" height="20" />
    <text class="label-text" x="400" y="23" text-anchor="middle">Header/title</text>
  </g>
  <line class="text-line" x1="275" y1="65" x2="400" y2="65" />
  <line x1="265" y1="85" x2="535" y2="85" stroke="#ddd" stroke-width="1" />

  <!-- Content area -->
  <rect class="hover-target" x="265" y="100" width="270" height="105" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="265" y1="150" x2="220" y2="150" />
    <rect class="label-bg" x="120" y="134" width="98" height="20" />
    <text class="label-text" x="169" y="148" text-anchor="middle">Content area</text>
  </g>
  <line class="text-line" x1="275" y1="110" x2="510" y2="110" />
  <line class="text-line" x1="275" y1="130" x2="490" y2="130" />
  <line class="text-line" x1="275" y1="150" x2="520" y2="150" />
  <rect class="interactive" x="275" y="175" width="100" height="25" rx="4" />
  <line class="text-line" x1="295" y1="187" x2="355" y2="187" />

  <!-- Close button (optional) -->
  <rect class="hover-target" x="515" y="50" width="20" height="20" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="535" y1="60" x2="570" y2="60" />
    <rect class="label-bg" x="572" y="44" width="98" height="20" />
    <text class="label-text" x="621" y="58" text-anchor="middle">Close button</text>
  </g>
  <circle class="optional" cx="525" cy="60" r="8" />
  <line x1="521" y1="56" x2="529" y2="64" stroke="#999" stroke-width="1.5" />
  <line x1="529" y1="56" x2="521" y2="64" stroke="#999" stroke-width="1.5" />

  <!-- Arrow -->
  <rect class="hover-target" x="390" y="220" width="20" height="20" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="400" y1="240" x2="450" y2="240" />
    <rect class="label-bg" x="452" y="224" width="50" height="20" />
    <text class="label-text" x="477" y="238" text-anchor="middle">Arrow</text>
  </g>
  <path class="optional" d="M 390 220 L 400 230 L 410 220 Z" fill="#fff" stroke="#999" stroke-width="2" />
</svg>

<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Featured image -->
  <rect class="hover-target" x="100" y="20" width="600" height="120" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="400" y1="10" x2="400" y2="-10" />
    <rect class="label-bg" x="312" y="-28" width="176" height="20" />
    <text class="label-text" x="400" y="-14" text-anchor="middle">Featured image</text>
  </g>
  <rect class="media-placeholder" x="100" y="20" width="600" height="120" rx="4" />

  <!-- Heading -->
  <rect class="hover-target" x="100" y="160" width="450" height="30" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="325" y1="150" x2="325" y2="130" />
    <rect class="label-bg" x="280" y="114" width="90" height="20" />
    <text class="label-text" x="325" y="128" text-anchor="middle">Heading</text>
  </g>
  <line class="text-line" x1="100" y1="175" x2="550" y2="175" stroke-width="2" />

  <!-- Metadata -->
  <rect class="hover-target" x="100" y="200" width="280" height="16" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="240" y1="225" x2="240" y2="245" />
    <rect class="label-bg" x="183" y="247" width="114" height="20" />
    <text class="label-text" x="240" y="261" text-anchor="middle">Author/date</text>
  </g>
  <line class="text-line" x1="100" y1="208" x2="380" y2="208" />

  <!-- Content -->
  <rect class="hover-target" x="100" y="240" width="600" height="85" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="400" y1="335" x2="400" y2="355" />
    <rect class="label-bg" x="360" y="357" width="80" height="20" />
    <text class="label-text" x="400" y="371" text-anchor="middle">Content</text>
  </g>
  <line class="text-line" x1="100" y1="250" x2="700" y2="250" />
  <line class="text-line" x1="100" y1="265" x2="680" y2="265" />
  <line class="text-line" x1="100" y1="280" x2="690" y2="280" />
  <line class="text-line" x1="100" y1="295" x2="670" y2="295" />
  <line class="text-line" x1="100" y1="310" x2="685" y2="310" />
</svg>

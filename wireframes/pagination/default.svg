<svg viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect class="region" x="0" y="0" width="800" height="250" />

  <!-- Pagination controls -->
  <rect class="hover-target" x="150" y="95" width="500" height="40" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="400" y1="90" x2="400" y2="70" />
    <rect class="label-bg" x="337" y="54" width="126" height="20" />
    <text class="label-text" x="400" y="68" text-anchor="middle">Pagination bar</text>
  </g>

  <!-- Previous button -->
  <rect class="interactive" x="150" y="95" width="60" height="40" rx="4" />
  <path class="interactive" d="M 185 115 L 175 115" stroke-width="2" />
  <path class="interactive" d="M 175 110 L 170 115 L 175 120" stroke-width="2" fill="none" />

  <!-- Page numbers -->
  <rect class="interactive" x="220" y="95" width="40" height="40" rx="4" />
  <text x="240" y="122" text-anchor="middle" font-size="16">1</text>

  <rect class="interactive" x="270" y="95" width="40" height="40" rx="4" style="fill: var(--wireframe-interactive)" />
  <text x="290" y="122" text-anchor="middle" font-size="16" fill="#fff">2</text>
  <rect class="hover-target" x="270" y="95" width="40" height="40" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="290" y1="140" x2="290" y2="160" />
    <rect class="label-bg" x="232" y="162" width="116" height="20" />
    <text class="label-text" x="290" y="176" text-anchor="middle">Current page</text>
  </g>

  <rect class="interactive" x="320" y="95" width="40" height="40" rx="4" />
  <text x="340" y="122" text-anchor="middle" font-size="16">3</text>

  <text x="375" y="119" text-anchor="middle" font-size="16">...</text>

  <rect class="interactive" x="410" y="95" width="40" height="40" rx="4" />
  <text x="430" y="122" text-anchor="middle" font-size="16">10</text>

  <!-- Next button -->
  <rect class="interactive" x="460" y="95" width="60" height="40" rx="4" />
  <path class="interactive" d="M 485 115 L 495 115" stroke-width="2" />
  <path class="interactive" d="M 495 110 L 500 115 L 495 120" stroke-width="2" fill="none" />
</svg>

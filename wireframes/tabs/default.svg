<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect class="region" x="0" y="0" width="800" height="350" />

  <!-- Tab buttons -->
  <rect class="hover-target" x="100" y="40" width="600" height="40" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="400" y1="35" x2="400" y2="15" />
    <rect class="label-bg" x="341" y="-1" width="118" height="20" />
    <text class="label-text" x="400" y="13" text-anchor="middle">Tab buttons</text>
  </g>
  <rect class="interactive" x="100" y="40" width="120" height="40" style="fill:#0066cc" />
  <line x1="110" y1="60" x2="210" y2="60" stroke="#fff" stroke-width="2" />
  <rect class="interactive" x="225" y="40" width="120" height="40" rx="0" />
  <line class="text-line" x1="235" y1="60" x2="335" y2="60" />
  <rect class="interactive" x="350" y="40" width="120" height="40" rx="0" />
  <line class="text-line" x1="360" y1="60" x2="460" y2="60" />
  <rect class="interactive" x="475" y="40" width="120" height="40" rx="0" />
  <line class="text-line" x1="485" y1="60" x2="585" y2="60" />

  <!-- Active indicator -->
  <rect x="100" y="77" width="120" height="3" fill="#0066cc" />

  <!-- Panel content -->
  <rect class="hover-target" x="100" y="100" width="600" height="200" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="750" y1="200" x2="770" y2="200" />
    <rect class="label-bg" x="772" y="190" width="28" height="20" />
    <text class="label-text" x="786" y="204" text-anchor="middle">Panel</text>
  </g>
  <rect x="100" y="100" width="600" height="200" fill="rgba(0,0,0,0.02)" stroke="#ccc" stroke-width="1" rx="4" />
  <line class="text-line" x1="130" y1="140" x2="620" y2="140" />
  <line class="text-line" x1="130" y1="160" x2="600" y2="160" />
  <line class="text-line" x1="130" y1="180" x2="640" y2="180" />
  <line class="text-line" x1="130" y1="200" x2="580" y2="200" />
  <line class="text-line" x1="130" y1="220" x2="610" y2="220" />
</svg>

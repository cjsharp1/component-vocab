<svg viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect class="region" x="0" y="0" width="800" height="250" />

  <!-- Icon -->
  <rect class="hover-target" x="50" y="100" width="40" height="40" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="70" y1="90" x2="70" y2="70" />
    <rect class="label-bg" x="47" y="54" width="46" height="20" />
    <text class="label-text" x="70" y="68" text-anchor="middle">Icon</text>
  </g>
  <circle class="interactive optional" cx="70" cy="120" r="18" />

  <!-- Text -->
  <rect class="hover-target" x="120" y="100" width="480" height="40" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="360" y1="95" x2="360" y2="75" />
    <rect class="label-bg" x="337" y="59" width="46" height="20" />
    <text class="label-text" x="360" y="73" text-anchor="middle">Text</text>
  </g>
  <line class="text-line" x1="120" y1="115" x2="580" y2="115" />
  <line class="text-line" x1="120" y1="130" x2="500" y2="130" />

  <!-- Link/Button -->
  <rect class="hover-target" x="620" y="105" width="100" height="30" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="670" y1="140" x2="670" y2="160" />
    <rect class="label-bg" x="622" y="162" width="96" height="20" />
    <text class="label-text" x="670" y="176" text-anchor="middle">Link/Button</text>
  </g>
  <rect class="interactive optional" x="620" y="105" width="100" height="30" rx="4" />
  <line class="text-line" x1="645" y1="120" x2="695" y2="120" />

  <!-- Dismiss button -->
  <rect class="hover-target" x="730" y="110" width="20" height="20" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="740" y1="140" x2="740" y2="160" />
    <rect class="label-bg" x="666" y="162" width="148" height="20" />
    <text class="label-text" x="740" y="176" text-anchor="middle">Dismiss button</text>
  </g>
  <circle class="interactive optional" cx="740" cy="120" r="10" />
  <line x1="735" y1="115" x2="745" y2="125" stroke="#333" stroke-width="1.5" />
  <line x1="745" y1="115" x2="735" y2="125" stroke="#333" stroke-width="1.5" />
</svg>

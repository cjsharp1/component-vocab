<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect class="region" x="0" y="0" width="800" height="350" />

  <!-- Label/percentage (optional) -->
  <rect class="hover-target" x="100" y="120" width="100" height="25" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="150" y1="115" x2="150" y2="95" />
    <rect class="label-bg" x="61" y="79" width="178" height="20" />
    <text class="label-text" x="150" y="93" text-anchor="middle">Label/percentage</text>
  </g>
  <line class="text-line" x1="110" y1="135" x2="185" y2="135" />

  <!-- Progress bar container -->
  <rect x="100" y="170" width="600" height="30" rx="15" fill="#e0e0e0" stroke="#999" stroke-width="1" />

  <!-- Bar/indicator (filled portion) -->
  <rect class="hover-target" x="100" y="170" width="360" height="30" fill="none" stroke="none" style="cursor:pointer" />
  <g class="label-group">
    <line class="label-line" x1="280" y1="205" x2="280" y2="225" />
    <rect class="label-bg" x="206" y="227" width="148" height="20" />
    <text class="label-text" x="280" y="241" text-anchor="middle">Bar/indicator</text>
  </g>
  <rect x="100" y="170" width="360" height="30" rx="15" fill="#4a90d9" />
</svg>

name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate data
        run: node scripts/validate.mjs
      - name: Generated pages are current, links resolve
        run: node scripts/build.mjs --check
